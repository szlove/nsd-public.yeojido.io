[[items]]
  question = "오르는 낙성대 인근 어디쯤인가요?"
  answer = "낙성대 퍼블릭 오르는 서울 관악구 봉천동 쪽에 있어요. 구체적인 위치는 전화나 텔레그램으로 여쭤보시면 안내해 드려요."
[[items]]
  question = "하루 중 언제 영업하나요?"
  answer = "저녁 18:00에 시작해서 다음날 15:00까지 매일 이어져요. 새벽 시간대 방문도 언제든 가능해요."
[[items]]
  question = "예약하려면 무엇으로 연락하나요?"
  answer = "010-7456-5410번으로 하루 중 아무 때나 연락 주시면 돼요. 방문하실 인원수를 알려주시면 자리를 마련해 둘게요."
[[items]]
  question = "이용 가격은 얼마 정도인가요?"
  answer = "인원에 따라 1인 20만원, 2인 30만원, 3인 42만원, 4인 56만원이에요. 정확한 견적은 상담 중에 다시 안내받으실 수 있어요."
